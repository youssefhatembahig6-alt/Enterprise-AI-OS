name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
        options: >-
          --ulimit nofile=65536:65536
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      # M6: real Mailpit for the approved-email delivery and reconciliation tests.
      mailpit:
        image: axllent/mailpit:v1.27.11
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_DATABASE: /data/mailpit.db
        volumes:
          - mailpit-data:/data
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:ci-only-superuser-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_QDRANT_URL: http://127.0.0.1:6333
      TEST_MAILPIT_SMTP_HOST: 127.0.0.1
      TEST_MAILPIT_SMTP_PORT: "1025"
      TEST_MAILPIT_API_URL: http://127.0.0.1:8025
      EAIOS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy app tests
      - name: M7 evaluation smoke (frozen split, leakage, pilot determinism)
        # Deterministic: no network, database or model. Fails on any family or derived
        # example crossing splits, an edited frozen manifest, or a non-reproducible build.
        run: .venv/bin/python -m app.evaluation check
      - name: Pytest (unit + real PostgreSQL/Redis/Mailpit integration)
        # The receipt-persistence test restarts the Mailpit service container (the
        # job context is only available at step level).
        env:
          TEST_MAILPIT_RESTART_CMD: docker restart ${{ job.services.mailpit.id }}
          EAIOS_REQUIRE_MAILPIT_RESTART: "1"
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"  # lint/typecheck only need Electron's types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  desktop:
    # M5 local-folder connector: engine tests on the real filesystem and watcher, then
    # the real Electron app's smoke run against the MOCK backend
    # (apps/desktop/tools/mock-backend.ts), on Linux and Windows. The live smoke against
    # the real backend is scripts/m5_desktop_smoke.py (docs/evidence/m5/README.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @eaios/web
      - name: Engine tests (real filesystem and recursive watcher)
        run: npm test -w @eaios/desktop
      - name: Allow Chromium's sandbox (Ubuntu 24.04 restricts user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Electron smoke, mock backend (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a node dist/tools/mock-backend.js --run-smoke smoke-report-${{ runner.os }}.json
      - name: Electron smoke, mock backend (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node dist/tools/mock-backend.js --run-smoke smoke-report-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: apps/desktop/smoke-report-*.json

  gpu-feasibility-notebook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Notebook matches its generator
        run: python ml/gpu-feasibility/build_notebook.py --check
      - name: CPU-only benchmark logic tests (standard library)
        run: python -m unittest discover -s ml/gpu-feasibility/tests -v

  parser-benchmark:
    # Laptop half of the M1 parser benchmark: fixture hashes and byte-for-byte regeneration,
    # scorer tests, the no-model guard, and the generated notebook and results tables.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml/parser-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Fonts used by the fixture generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - name: Install the pinned laptop environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-laptop.txt ruff==0.13.0
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Fixtures regenerate byte-for-byte
        run: .venv/bin/python fixtures/generate.py --check
      - name: Tests (scorer, fixtures, no-model guard, notebook, tables)
        run: .venv/bin/python -m unittest discover -s tests -v

  vllm-tokenizer:
    # Initialises the real Qwen tokenizers through vLLM's tokenizer code path, on CPU,
    # in an environment installed exactly from ml/gpu-feasibility/vllm-env-pins.txt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Install the pinned vLLM environment (CPU torch)
        run: |
          python -m pip install uv==0.9.5
          uv venv --python "$(which python)" /tmp/vllm-env
          uv pip install --python /tmp/vllm-env/bin/python --torch-backend cpu -r ml/gpu-feasibility/vllm-env-pins.txt
      - name: Qwen tokenizers through vLLM (required, not skipped)
        env:
          EAIOS_VLLM_PYTHON: /tmp/vllm-env/bin/python
          EAIOS_REQUIRE_VLLM_TOKENIZER_TEST: "1"
        run: python -m unittest ml/gpu-feasibility/tests/test_vllm_tokenizer.py -v

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build images
        run: docker compose build api frontend
