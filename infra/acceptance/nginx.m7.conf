# M7 acceptance only: apps/web/nginx.conf with connect-src pointed at the disposable API
# (port 18000). See docs/evidence/m7-functional/README.md, bug B1.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:18000 http://127.0.0.1:18000; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        try_files $uri /index.html;
    }
}
