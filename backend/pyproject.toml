[project]
name = "eaios-backend"
version = "0.1.0"
description = "Enterprise AI OS backend (M0 foundation)"
requires-python = ">=3.13,<3.14"

# Dependencies are pinned in requirements.in / requirements-dev.in and locked with
# hashes in requirements.lock / requirements-dev.lock (see scripts/dev.py lock).

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "S311", "E501", "PLC0415"]
# The M2 SQL security tests deliberately build hostile SQL strings.
"tests/unit/test_report_*.py" = ["S608"]
"tests/integration/test_report_*.py" = ["S608"]
"app/db/migrations/**" = ["E501"]
"app/cli.py" = ["PLC0415"]
# Prompt text and the fake model's canned output contain SQL strings that are never
# executed directly; model SQL is always parsed and validated (app/reporting/sql_guard.py).
"app/reporting/prompts.py" = ["S608"]
"app/reporting/model_client.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "argon2.*", "openpyxl.*", "pdfplumber.*", "pdfminer.*",
          "boto3.*", "botocore.*"]
ignore_missing_imports = true

# pglast's generated AST node classes are untyped; these two modules walk them.
[[tool.mypy.overrides]]
module = ["app.reporting.sql_guard", "app.reporting.semantics"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pglast.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires real PostgreSQL and Redis (TEST_DATABASE_ADMIN_URL, TEST_REDIS_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
