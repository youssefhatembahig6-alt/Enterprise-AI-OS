# Frozen M1 evaluation cases for the verified quarterly sales report (M2 target).
# Frozen 2026-11-20. Do not edit expected values: a change needs a new case id.
#
# Reporting definition (applies to every case and to the worked subset):
#   quarter        2026-Q1 = order_date from 2026-01-01 through 2026-03-31, inclusive
#   date basis     sales_orders.order_date (invoice issue_date is NOT used)
#   statuses       FULFILLED only; PENDING and CANCELLED are excluded
#   tax            "net sales" = tax-exclusive = sales_orders.subtotal
#                  tax = sales_orders.tax (14 %); gross = total = subtotal + tax
#   currency       USD (the only currency in the dataset; no conversion)
#   rounding       amounts are exact 2-decimal values; sums are exact decimals,
#                  reported to 2 places, no intermediate rounding
#   invoice status payment status (PAID/OPEN/OVERDUE) does not affect sales

dataset = "niletech-0.1.6"
source_revision = "bf4a247a5c3db8bcedc37e0ed47dad6c635d9349"
source_content_fingerprint = "36c7784f6754f44a17d08c96018f3bbea1512490079167a33df55a1f311122f0"
normalized_fingerprint = "e5715a94f93ed42dd31b3f00337af4bb591495a0cfd96f7a5a8ca90555bef127"
reference_date = "2026-06-30"
quarter_start = "2026-01-01"
quarter_end = "2026-03-31"
included_statuses = ["FULFILLED"]
currency = "USD"
tax_rate = "0.14"

[[cases]]
id = "m1-sales-q1-2026-net-fulfilled"
split = "dev"
question = "What were NileTech's net (tax-exclusive) fulfilled sales for Q1 2026, in USD?"
asking_identity = "niletech/finance-reader"   # M0 fixture login (finance, confidential)
tenant = "niletech"
permitted_evidence = ["sales_orders", "sales_order_lines", "sales_invoices"]
expected_kind = "answer"
allowed_side_effects = []                     # read-only: no writes, messages or exports
# Full-quarter figures. Computed by an independent Python pass over the source
# JSONL (tests/unit/test_sales_reference.py), not by SQL and not by hand.
expected_order_count = 291
expected_net = "80934385.00"
expected_tax = "11330813.90"
expected_gross = "92265198.90"
# Context that a correct answer must not confuse with net fulfilled sales:
distractor_all_status_net = "102987786.00"    # includes 40 PENDING + 28 CANCELLED orders
distractor_fulfilled_gross = "92265198.90"    # tax-inclusive

[[cases]]
id = "m1-sales-q1-2026-isolation-boundary"
split = "dev"
question = "What were NileTech's net (tax-exclusive) fulfilled sales for Q1 2026, in USD?"
asking_identity = "isolation-test/finance-reader"   # M0 anonymous isolation fixture
tenant = "isolation-test"
permitted_evidence = []                       # this tenant holds no business data
expected_kind = "abstention"                  # no sources; must not reveal NileTech figures
forbidden_values = ["80934385.00", "593489.00"]
allowed_side_effects = []

# Hand-checked worked subset: ten NileTech orders chosen to exercise every rule.
