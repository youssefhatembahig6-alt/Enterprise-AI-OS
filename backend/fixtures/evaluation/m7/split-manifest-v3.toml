# M7 train/dev/held-out split manifest, version 3. Frozen 2026-11-26.
#
# Supersedes split-manifest-v2 (kept unchanged as an audit record). It is identical to v2 for
# the nine development-exposed families, which all stay `dev`, and adds FRESH families for
# training and the release holdout. Their documents come from the deterministic generator
# backend/app/evaluation/corpus_v3.py (seed 20261126, version 3.0.0). That generator's SHA-256,
# the seed and every file hash are recorded in corpus-v3/corpus.toml; the lock below also hashes
# each document together with its facts sidecar.
#
# The original NileTech generator (old repository, commit bf4a247, scripts/seed) was located but
# not used: the dev corpus was built from its templates and stated values. See
# docs/evaluation/m7-v3-corpus.md.
#
# Rules (enforced by the M7 check):
#   1. Every source belongs to exactly one family; whole families are assigned to one split.
#   2. Development-exposed families stay `dev` (the exposure scan of tests, scripts, ML runs and
#      evidence still applies; train and held-out families must not be mentioned there).
#   3. One template per fresh family. Fresh families share no digit-masked word 8-gram and no
#      fact name with any dev source, with one another, or with the original generator's
#      archive (when present locally). See app/evaluation/overlap.py.
#   4. Held-out families are SEALED: no pilot or derived record, tuning run or model-selection
#      step may use them. Pair, claim and question generation happens later, after this freeze.
#
# Freezing: split-manifest-v3.lock.json plus the hand-written entry in frozen-snapshots.json,
# which CI also compares with `main`.

version = 3
name = "m7-split-v3"
frozen_at = "2026-11-26"
supersedes = "m7-split-v2"
splits = ["train", "dev", "heldout"]

# Member references: doc:, contract:, code:, sql: as in v2;
#   fresh:<key>   backend/fixtures/evaluation/m7/corpus-v3/corpus.toml

[sql_templates.sales-period-net-fulfilled]
description = "Net (tax-exclusive) FULFILLED sales for a calendar period, order_date basis, USD"
