# M7 PILOT seeds, authored after split-manifest-v1 was frozen (commit 57ed79c). Families and
# splits are resolved under the ACTIVE manifest (split-manifest-v3, frozen in commit 497632c
# before this pilot was re-indexed; v2 was frozen in ba6e9c8). Every source here is in one of
# the nine development-exposed families (identical in v2 and v3), so
# every derived record is dev: the "checker-train" seeds below are a FORMAT exercise and must
# not be used to train a checker, and nothing here is held-out.
#
# PILOT ONLY. Not the release evaluation, not training data at the roadmap's planned
# sizes, and not human-reviewed. Every item here was drafted by an AI assistant
# (claude-opus-5-5) from the fixture sources and must be reviewed by two people
# before any of it counts as gold (see docs/evaluation/m7-labelling.md).
#
# `python -m app.evaluation build-pilot` derives the four pilot datasets from this file
# and from the frozen pre-M7 fixtures. Rules the M7 check enforces:
#   * every item's family comes from the active frozen manifest; no item uses a held-out family;
#   * every evidence source a record cites is declared in its `sources`, and every parent
#     (seed or legacy fixture item) resolves to the same family and split;
#   * every evidence span is an exact substring of the source's canonical text
#     (the application's own native parser output) or, for SQL, of a frozen fixture value;
#   * claims are atomic: one sentence, no semicolons, at most 30 words;
#   * perturbations stay in their seed's family and split.

version = 1
manifest = "m7-split-v3"
created = "2026-11-25"
author = "claude-opus-5-5 (AI draft; not human-reviewed)"

