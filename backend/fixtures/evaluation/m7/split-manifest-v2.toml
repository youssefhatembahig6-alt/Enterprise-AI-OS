# Fresh families reserved for regenerated NileTech documents. They have no members until v3, and
# held-out ones stay sealed.
[[reserved_families]]
id = "fresh-train-regenerated"
split = "train"
reason = "Checker training pairs and train-split QA from regenerated documents no development artifact has touched."

[[reserved_families]]
id = "fresh-heldout-regenerated-a"
