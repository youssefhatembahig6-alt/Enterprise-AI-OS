# M3 relevance-filter study (dev split). Frozen 2026-11-21.
#
# Each pair is a question and one passage copied verbatim from the M3 corpus, labelled
# by hand: `relevant = true` when the passage answers the question. The four kinds:
#   paraphrase  relevant, but shares no significant term with the question
#               (a word-overlap gate wrongly drops it)
#   trap        irrelevant, but shares a keyword with the question
#               (a word-overlap gate wrongly keeps it)
#   match       relevant and shares terms (control)
#   unrelated   irrelevant and shares nothing (control)
# `python -m app.cli relevance-study` scores every pair with the lexical gate and with
# BGE-M3 dense cosine similarity (real only in MODEL_MODE=gateway).

version = 1

