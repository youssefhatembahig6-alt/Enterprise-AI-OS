id = "para-vacation-cairo"
kind = "paraphrase"
relevant = true
question = "How much vacation does someone in Cairo get?"
passage = "Employees in Egypt receive 21 working days of annual leave per year; after ten years of service this rises to 30 days. Employees in the UAE receive 30 calendar days."

