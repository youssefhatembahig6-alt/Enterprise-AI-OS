# M3 retrieval development cases (dev split; not a held-out evaluation). Frozen 2026-11-21.
# Each case names the document and an exact substring of its canonical text that a
# correct top-k result must contain. Asked as niletech/finance-reader unless stated.
# Used by `python -m app.cli retrieval-eval` to compare dense with dense + sparse
# (RRF) retrieval on the same cases.

version = 1

[[cases]]
id = "fin-net-q1"
question = "What were net fulfilled sales in Q1 2026 according to the finance commentary?"
document = "finance-q1-commentary"
expect = "USD 80,934,385.00 across 291 orders"

[[cases]]
id = "fin-overdue"
question = "How many open invoices were past their due date?"
document = "finance-q1-commentary"
expect = "370 open invoices"

[[cases]]
id = "fin-cloud-variance"
question = "Why did cloud hosting exceed its budget?"
document = "finance-q1-commentary"
expect = "data-platform migration ran six weeks longer"

[[cases]]
id = "fin-travel"
question = "What was the actual travel spend versus budget?"
document = "finance-q1-commentary"
expect = "Travel | 95,000 | 61,250"

