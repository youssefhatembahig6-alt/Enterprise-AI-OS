# M3 document corpus fixture. Synthetic files only; every file is verified by
# SHA256SUMS. Six files are copied byte-for-byte from the M1 parser benchmark
# (ml/parser-benchmark/fixtures/files; checked against its manifest in tests).
#
# Permissions use the M0 vocabulary (classification, department, department
# restriction, countries, grants by group or user key). A document without a
# [documents.permissions] table is stored with permission_state = "unknown" and must
# never be retrievable (T7).

version = 1

[[documents]]
key = "finance-q1-commentary"
tenant = "niletech"
file = "finance-q1-commentary.md"
title = "Q1 2026 finance commentary"
marker = "NILETECH-FINANCE-SECRET-7421"
  [documents.permissions]
  classification = "confidential"
  department = "finance"
  department_restricted = true
  allowed_countries = ["EG"]
  grants = [{ group = "finance-team", effect = "allow" }, { user = "denied-reader", effect = "deny" }]

